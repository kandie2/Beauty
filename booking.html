<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | Beauty.Core</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">💅 BEAUTY.CORE</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="booking.html">Booking</a>
            <a href="about.html">System</a>
            <a href="contact.html">Terminal</a>
        </nav>
    </header>

    <section>
        <h2>INITIATE APPOINTMENT</h2>
        <div class="booking-form">
            <form action="process_booking.php" method="POST">
                <div class="form-group">
                    <label for="name">Customer Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter User ID">
                </div>
                <div class="form-group">
                    <label for="service">Select Service</label>
                    <select id="service" name="service" required>
                        <option value="manicure">Manicure.exe</option>
                        <option value="gel">Gel.patch</option>
                        <option value="art">Art.core</option>
                        <option value="pedicure">Pedicure.sys</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Time</label>
                    <input type="time" id="time" name="time" required>
                </div>
                <button type="submit" class="btn">Confirm Protocol</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 BEAUTY.CORE // ALL RIGHTS RESERVED // V1.0.42</p>
    </footer>

    <script src="js/script.js"></script>
